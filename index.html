:root {
  --ink: #20352f;
  --muted: #71807b;
  --line: #e2e9e5;
  --bg: #f4f7f5;
  --green: #146c5a;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
}
button {
  font: inherit;
}
.topbar {
  height: 84px;
  background: #fff;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 max(24px, calc((100vw - 1380px) / 2));
  position: sticky;
  top: 0;
  z-index: 10;
}
.brand {
  display: flex;
  gap: 14px;
  align-items: center;
}
.brandMark {
  display: grid;
  place-items: center;
  background: var(--green);
  color: #fff;
  width: 52px;
  height: 52px;
  border-radius: 17px;
  font-size: 13px;
  font-weight: 800;
}
.brand h1 {
  font-size: 20px;
  margin: 0 0 4px;
  letter-spacing: -0.03em;
}
.brand p {
  font-size: 12px;
  color: var(--muted);
  margin: 0;
}
.headerActions {
  display: flex;
  gap: 8px;
}
.ghost {
  background: #fff;
  border: 1px solid #d8e1dd;
  border-radius: 10px;
  padding: 10px 13px;
  color: #40544e;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.ghost:hover {
  background: #f3f7f5;
}
.ghost.danger {
  color: #aa5656;
}
.shell {
  max-width: 1380px;
  margin: 0 auto;
  padding: 26px 24px 48px;
}
.summary {
  display: grid;
  grid-template-columns: 1.2fr repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 18px;
}
.summary > div,
.classCard {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 18px 20px;
  box-shadow: 0 4px 18px rgba(38, 73, 62, 0.04);
}
.summaryIntro {
  background: var(--green) !important;
  color: #fff !important;
  border-color: var(--green) !important;
}
.summaryIntro > span {
  font-size: 12px;
  opacity: 0.75;
}
.summaryIntro strong {
  display: block;
