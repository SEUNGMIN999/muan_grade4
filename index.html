:root {
  --ink: #20352f;
  --muted: #71807b;
  --line: #e2e9e5;
  --bg: #f4f7f5;
  --green: #146c5a;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
}
button {
  font: inherit;
}
.topbar {
  height: 84px;
  background: #fff;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 max(24px, calc((100vw - 1380px) / 2));
  position: sticky;
  top: 0;
  z-index: 10;
}
.brand {
  display: flex;
  gap: 14px;
  align-items: center;
}
.brandMark {
  display: grid;
  place-items: center;
  background: var(--green);
  color: #fff;
  width: 52px;
  height: 52px;
  border-radius: 17px;
  font-size: 13px;
  font-weight: 800;
}
.brand h1 {
  font-size: 20px;
  margin: 0 0 4px;
  letter-spacing: -0.03em;
}
.brand p {
  font-size: 12px;
  color: var(--muted);
  margin: 0;
}
.headerActions {
  display: flex;
  gap: 8px;
}
.ghost {
  background: #fff;
  border: 1px solid #d8e1dd;
  border-radius: 10px;
  padding: 10px 13px;
  color: #40544e;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.ghost:hover {
  background: #f3f7f5;
}
.ghost.danger {
  color: #aa5656;
}
.shell {
  max-width: 1380px;
  margin: 0 auto;
  padding: 26px 24px 48px;
}
.summary {
  display: grid;
  grid-template-columns: 1.2fr repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 18px;
}
.summary > div,
.classCard {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 18px 20px;
  box-shadow: 0 4px 18px rgba(38, 73, 62, 0.04);
}
.summaryIntro {
  background: var(--green) !important;
  color: #fff !important;
  border-color: var(--green) !important;
}
.summaryIntro > span {
  font-size: 12px;
  opacity: 0.75;
}
.summaryIntro strong {
  display: block;
  font-size: 34px;
  line-height: 1.15;
  margin-top: 3px;
}
.summaryIntro small {
  font-size: 14px;
  margin-left: 4px;
}
.summaryIntro p {
  font-size: 12px;
  margin: 5px 0 0;
  opacity: 0.8;
}
.classTitle {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #edf1ef;
  padding-bottom: 11px;
}
.classTitle b {
  font-size: 19px;
}
.classTitle strong {
  font-size: 13px;
  color: var(--green);
}
.subjectStats {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}
.subjectStats div {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  color: var(--muted);
  flex: 1;
}
.subjectStats b {
  margin-left: auto;
  color: var(--ink);
  font-size: 14px;
}
.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
}
.calendarPanel {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 22px;
  overflow: hidden;
  box-shadow: 0 8px 32px rgba(38, 73, 62, 0.06);
}
.calendarHead {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 30px;
  padding: 22px;
  border-bottom: 1px solid var(--line);
}
.calendarHead button {
  border: 1px solid var(--line);
  background: #fff;
  width: 38px;
  height: 38px;
  border-radius: 12px;
  font-size: 25px;
  color: var(--green);
  cursor: pointer;
}
.calendarHead h2 {
  text-align: center;
  font-size: 22px;
  margin: 0 0 4px;
}
.calendarHead p {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  margin: 0;
}
.weekdays,
.calendarGrid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
}
.weekdays {
  border-bottom: 1px solid var(--line);
  background: #fafcfb;
}
.weekdays span {
  text-align: center;
  padding: 10px;
  font-size: 12px;
  font-weight: 700;
  color: #64736e;
}
.weekdays span:first-child {
  color: #d26363;
}
.weekdays span:last-child {
  color: #4f70bd;
}
.calendarGrid {
  background: var(--line);
  gap: 1px;
}
.day {
  height: 106px;
  border: 0;
  background: #fff;
  padding: 10px;
  text-align: left;
  position: relative;
  cursor: pointer;
  color: var(--ink);
}
.day:hover {
  background: #f2f8f5;
}
.day.blank {
  cursor: default;
  background: #fafcfb;
}
.day.weekend:not(.hasRecord) {
  background: #fcfdfd;
}
.dateNo {
  font-size: 13px;
  font-weight: 700;
}
.hasRecord {
  background: #f7fbf9;
}
.hasRecord .dateNo {
  background: #deeee8;
  color: #0c6552;
  width: 26px;
  height: 26px;
  border-radius: 9px;
  display: grid;
  place-items: center;
}
.addHint {
  position: absolute;
  left: 10px;
  bottom: 10px;
  color: #a5b0ac;
  font-size: 11px;
  opacity: 0;
}
.day:hover .addHint {
  opacity: 1;
}
.hasRecord strong {
  position: absolute;
  right: 10px;
  bottom: 10px;
  font-size: 13px;
  color: #315b50;
}
.miniDots {
  display: flex;
  gap: 4px;
  margin-top: 11px;
}
.miniDots i {
  display: block;
  width: 17px;
  height: 4px;
  border-radius: 10px;
}
.legend {
  display: flex;
  gap: 18px;
  align-items: center;
  padding: 13px 18px;
  background: #fbfcfc;
  font-size: 12px;
  color: #65736f;
}
.legend span {
  display: flex;
  align-items: center;
  gap: 6px;
}
.legend i {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}
.legend em {
  margin-left: auto;
  font-style: normal;
  color: #929d99;
}
.modalBackdrop {
  position: fixed;
  inset: 0;
  background: rgba(20, 40, 34, 0.48);
  backdrop-filter: blur(4px);
  z-index: 30;
  display: grid;
  place-items: center;
  padding: 20px;
}
.modal {
  width: min(620px, 100%);
  background: #fff;
  border-radius: 24px;
  box-shadow: 0 24px 70px rgba(0, 0, 0, 0.22);
  overflow: hidden;
}
.modalHead {
  padding: 22px 24px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
}
.modalHead span {
  font-size: 11px;
  color: var(--green);
  font-weight: 800;
}
.modalHead h2 {
  margin: 4px 0 0;
  font-size: 24px;
}
.modalHead button {
  border: 0;
  background: #eef3f1;
  border-radius: 50%;
  width: 36px;
  height: 36px;
  font-size: 23px;
  color: #53635e;
  cursor: pointer;
}
.entryTable {
  padding: 8px 24px;
}
.entryHeader,
.entryRow {
  display: grid;
  grid-template-columns: 70px repeat(3, 1fr);
  align-items: center;
}
.entryHeader {
  padding: 13px 0;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
}
.entryHeader span {
  text-align: left;
}
.entryRow {
  padding: 12px 0;
  border-top: 1px solid #edf1ef;
}
.entryRow > strong {
  font-size: 17px;
}
.stepper {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
}
.stepper button {
  width: 30px;
  height: 30px;
  border: 1px solid #dce5e1;
  background: #fff;
  border-radius: 9px;
  color: var(--green);
  font-weight: 800;
  cursor: pointer;
}
.stepper button:hover {
  background: #edf7f3;
}
.stepper button:disabled {
  opacity: 0.3;
}
.stepper span {
  width: 22px;
  text-align: center;
  color: #a0aaa6;
  font-weight: 800;
}
.stepper span.active {
  color: var(--ink);
}
.modalFoot {
  padding: 16px 24px 22px;
  background: #f8faf9;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modalFoot p {
  font-size: 12px;
  color: var(--muted);
  margin: 0;
}
.modalFoot > button {
  border: 0;
  background: var(--green);
  color: #fff;
  font-weight: 800;
  border-radius: 11px;
  padding: 12px 20px;
  cursor: pointer;
}
@media (max-width: 980px) {
  .summary {
    grid-template-columns: repeat(2, 1fr);
  }
  .summaryIntro {
    grid-column: span 2;
  }
  .day {
    height: 90px;
  }
  .topbar {
    padding: 0 18px;
  }
}
@media (max-width: 640px) {
  .topbar {
    height: auto;
    align-items: flex-start;
    padding: 14px 16px;
    gap: 10px;
  }
  .brandMark {
    width: 43px;
    height: 43px;
    border-radius: 14px;
  }
  .brand h1 {
    font-size: 16px;
  }
  .headerActions {
    flex-direction: column;
  }
  .ghost {
    padding: 7px 9px;
    font-size: 11px;
  }
  .shell {
    padding: 14px 10px 30px;
  }
  .summary {
    gap: 8px;
    margin-bottom: 10px;
  }
  .summary > div,
  .classCard {
    padding: 13px;
    border-radius: 15px;
  }
  .summaryIntro strong {
    font-size: 27px;
  }
  .subjectStats {
    flex-direction: column;
    gap: 5px;
  }
  .calendarPanel {
    border-radius: 17px;
  }
  .calendarHead {
    padding: 15px;
    gap: 20px;
  }
  .calendarHead h2 {
    font-size: 19px;
  }
  .day {
    height: 72px;
    padding: 6px;
  }
  .hasRecord .dateNo {
    width: 22px;
    height: 22px;
  }
  .hasRecord strong {
    font-size: 11px;
    right: 6px;
    bottom: 7px;
  }
  .miniDots {
    margin-top: 6px;
  }
  .miniDots i {
    width: 9px;
  }
  .legend {
    padding: 10px;
    gap: 10px;
  }
  .legend em {
    display: none;
  }
  .modal {
    border-radius: 20px;
  }
  .entryTable {
    padding: 6px 14px;
  }
  .entryHeader,
  .entryRow {
    grid-template-columns: 48px repeat(3, 1fr);
  }
  .stepper {
    gap: 3px;
  }
  .stepper button {
    width: 27px;
    height: 29px;
  }
  .modalFoot {
    padding: 14px;
    gap: 10px;
  }
  .modalFoot p {
    max-width: 150px;
  }
}

}

  background: linear-gradient(135deg, #086f5a, #0d9172) !important;
  box-shadow: 0 10px 26px rgba(8, 111, 90, 0.2) !important;
}
.classCard::before {
  content: "";
  position: absolute;
  inset: 0 0 auto;
  height: 4px;
  background: linear-gradient(90deg, #16a085, #ef8354, #667eea);
}
.classCard:nth-child(3)::before {
  background: linear-gradient(90deg, #ef8354, #f3b34c);
}
.classCard:nth-child(4)::before {
  background: linear-gradient(90deg, #667eea, #8d77db);

  box-shadow: 0 18px 46px rgba(31, 87, 70, 0.12);
